# Render.com blueprint — deploy with "New +" -> "Blueprint" after pushing to GitHub.
# Prerequisite: create a free MongoDB Atlas M0 cluster and paste its URI as an env var.
services:
  - type: web
    name: batiqa-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: MONGO_URI
        sync: false   # isi manual di dashboard Render: mongodb+srv://user:pass@cluster/...
      - key: DB_NAME
        value: batiqa_ai
      - key: GEMINI_API_KEY
        sync: false   # isi manual (secret)
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AI_PROVIDER
        value: gemini
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
