# BATIQA-AI - MySQL only (backend Go runs locally via `go run ./cmd/api`)
# Usage: docker-compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: batiqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-batiqa}
      MYSQL_DATABASE: batiqa_ai
    ports:
      - "3306:3306"
    volumes:
      - batiqa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-batiqa}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  batiqa_mysql_data:
