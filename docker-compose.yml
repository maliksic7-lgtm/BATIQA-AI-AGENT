# BATIQA-AI - MongoDB only (backend Go runs locally via run.bat / `go run ./cmd/api`)
# Usage: docker-compose up -d
services:
  mongodb:
    image: mongo:7
    container_name: batiqa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - batiqa_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  batiqa_mongo_data:
